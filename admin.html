<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>لوحة التحكم</title>
<style>
:root{--bg:#faf7f0;--cd:#fff;--tx:#1f2a24;--mu:#6b756e;--ac:#1d7a55;--bd:#e5dfd0;--bad:#b3402f}
@media(prefers-color-scheme:dark){:root{--bg:#141916;--cd:#1d2420;--tx:#eef2ee;--mu:#9aa69e;--ac:#43b787;--bd:#2c3630;--bad:#e5806f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,sans-serif;line-height:1.6}
.w{max-width:640px;margin:0 auto;padding:16px}.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
input,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0 7px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 12px;background:var(--ac);color:#fff;font-weight:600}
.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}.d{background:var(--bad)}.r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.m{font-size:13px;color:var(--mu)}.t{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.t button{flex:1}.hide{display:none}.er{color:var(--bad)}.bt{display:flex;gap:6px;margin-top:6px}
</style></head><body><div class="w"><h2>🛠️ لوحة التحكم</h2>
<div id="lg" class="c"><input id="e" type="email" dir="ltr" placeholder="البريد"><input id="p" type="password" placeholder="الرقم السري"><div id="er" class="er"></div><button onclick="login()">دخول</button></div>
<div id="app" class="hide"><div class="t"><button class="o" onclick="tab('b')">الحجوزات</button><button class="o" onclick="tab('x')">الخبراء</button><button class="o" onclick="tab('a')">الطلبات</button><button class="o" onclick="tab('c')">المحتوى</button><button class="o" onclick="tab('q')">الرسائل</button><button class="o" onclick="tab('s')">الإعدادات</button></div><div id="main"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://tbwjnqhlaqpcojekvnwn.supabase.co",SUPABASE_KEY="sb_publishable_cxidRJn8Ls2Izri3b5xFVg_-M68TjGy";
const SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),KEYS=["platform","whatsapp","phone","email","fee","pay_pi","pay_pw","pay_pb","pay_pv"];
let X=[],A=[],B=[],K=[];
const upl=(inp,max,png)=>new Promise(res=>{const f=inp.files[0];if(!f)return res("");const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL(png?"image/png":"image/jpeg",.82))};i.src=r.result};r.readAsDataURL(f)});
async function login(){const{error}=await SB.auth.signInWithPassword({email:$("e").value.trim(),password:$("p").value});if(error){$("er").textContent=error.message;return}start()}
async function start(){const{data}=await SB.rpc("is_admin");if(!data){$("er").textContent="غير مصرح";return}$("lg").classList.add("hide");$("app").classList.remove("hide");tab("b")}
async function tab(t){const m=$("main");
if(t==="b"){const{data}=await SB.from("bookings").select().order("created_at",{ascending:false});B=data||[];const L={pending:"بانتظار الدفع",confirmed:"مؤكد",cancelled:"ملغي"};
m.innerHTML=B.map((b,i)=>`<div class="c"><b>${esc(b.expert_name)}</b> · ${b.day} ${esc(b.tm)} · ${b.price} ج.م<div class="m">${L[b.status]} | ${esc(b.method)} | العميل: ${esc(b.client_name)} ${esc(b.client_phone)} ${esc(b.client_email)}</div><div class="bt"><button onclick="bs(${i},'confirmed')">تأكيد الدفع</button><button class="d" onclick="bs(${i},'cancelled')">إلغاء</button></div></div>`).join("")||'<div class="c m">لا حجوزات</div>'}
if(t==="x"){const{data}=await SB.from("experts").select().order("created_at");X=data||[];
m.innerHTML=`<div class="c"><b id="ft">إضافة خبير</b><input id="id" type="hidden"><input id="n" placeholder="الاسم"><input id="f" placeholder="المجال"><input id="pr" placeholder="سعر الساعة"><input id="bi" placeholder="نبذة" maxlength="160"><input id="cv" placeholder="السيرة الذاتية"><input id="dy" placeholder="الأيام: 0=الأحد ... 6=السبت مثل 0,2,4" dir="ltr"><input id="ti" placeholder="الأوقات مثل 10:00,13:00" dir="ltr"><div class="m">صورة الخبير (اختياري)</div><input id="ph" type="file" accept="image/*"><label><input id="ac" type="checkbox" checked style="width:auto"> ظاهر للعملاء</label><button onclick="saveX()">حفظ</button></div>`+X.map((e,i)=>`<div class="c r"><div><b>${esc(e.name)}</b> ${e.active?"":"(مخفي)"}<div class="m">${esc(e.field)} · ${e.price}</div></div><div class="bt"><button class="o" onclick="edit(${i})">تعديل</button><button class="d" onclick="delX('${e.id}')">حذف</button></div></div>`).join("")}
if(t==="a"){const{data}=await SB.from("applications").select().order("created_at",{ascending:false});A=data||[];
m.innerHTML=A.map((a,i)=>`<div class="c"><b>${esc(a.name)}</b> · ${esc(a.field)} · ${esc(a.price)}<div class="m">${esc(a.phone)} ${esc(a.email)}<br>${esc(a.avail)}<br>${esc(a.bio)}<br>${esc(a.cv)}</div><div class="bt"><button onclick="ok(${i})">اعتماد (يُنشأ مخفيًا لتكمله)</button><button class="d" onclick="rej('${a.id}')">رفض</button></div></div>`).join("")||'<div class="c m">لا طلبات</div>'}
if(t==="c"){const{data:s0}=await SB.from("settings").select(),s={};(s0||[]).forEach(r=>s[r.k]=r.v);const{data:k}=await SB.from("blocks").select().order("pos");K=k||[];
m.innerHTML=`<div class="c"><b>هوية المنصة</b><input id="cn" value="${esc(s.platform)}" placeholder="اسم المنصة"><input id="ct" value="${esc(s.tagline)}" placeholder="الشعار الفرعي"><div class="m">الشعار (صورة)</div><input id="cl" type="file" accept="image/*">${s.logo?`<img src="${esc(s.logo)}" style="height:48px;display:block;margin:4px 0">`:""}<div class="m">اللون الأساسي</div><input id="cc" type="color" value="${s.color||"#1d7a55"}" style="height:42px"><div class="bt"><button onclick="saveId()">حفظ الهوية</button>${s.logo?`<button class="d" onclick="rmLogo()">إزالة الشعار</button>`:""}</div></div><div class="c"><b>الدفع والتواصل</b>${[["pay_pi","رقم إنستا باي أو رابطه"],["pay_pw","رقم المحفظة أو رابطها"],["pay_pb","الحساب البنكي"],["pay_pv","رابط الفيزا"],["fee","العمولة مثل 0.15"],["whatsapp","واتساب بصيغة دولية بدون +"],["phone","الهاتف"],["email","البريد"]].map(([k,l])=>`<div class="m">${l}</div><input id="p_${k}" value="${esc(s[k])}">`).join("")}</div><div class="c"><b>الصفحات</b><div class="m">من نحن</div><textarea id="p_about" rows="5">${esc(s.about)}</textarea><div class="m">الشروط والخصوصية</div><textarea id="p_terms" rows="6">${esc(s.terms)}</textarea><button onclick="saveP()">حفظ الدفع والصفحات</button></div><div class="c"><b>إضافة فقرة</b><input id="nt" placeholder="العنوان"><input id="nb" placeholder="النص"><input id="ni" type="file" accept="image/*"><button onclick="addK()">إضافة</button></div>`+K.map((k,i)=>`<div class="c"><input id="kt${i}" value="${esc(k.title)}"><input id="kb${i}" value="${esc(k.body)}">${k.image?`<img src="${esc(k.image)}" style="width:100%;border-radius:8px">`:""}<input id="ki${i}" type="file" accept="image/*"><div class="bt"><button onclick="svK(${i})">حفظ</button><button class="o" onclick="mvK(${i},-1)">↑</button><button class="o" onclick="mvK(${i},1)">↓</button><button class="o" onclick="tgK(${i})">${k.active?"إخفاء":"إظهار"}</button><button class="d" onclick="dlK(${i})">حذف</button></div></div>`).join("")}
if(t==="q"){const{data}=await SB.from("inquiries").select().order("created_at",{ascending:false});m.innerHTML=(data||[]).map(q=>`<div class="c"><b>${esc(q.name)}</b> · ${esc(q.contact)}<div class="m">${esc(q.message)}</div><button class="d" onclick="dq('${q.id}')">حذف</button></div>`).join("")||'<div class="c m">لا رسائل</div>'}
if(t==="s"){const{data}=await SB.from("settings").select(),s={};(data||[]).forEach(r=>s[r.k]=r.v);
m.innerHTML='<div class="c">'+KEYS.map(k=>`<label class="m">${k}</label><input id="s_${k}" value="${esc(s[k])}">`).join("")+'<button onclick="saveS()">حفظ الإعدادات</button><p class="m">whatsapp بصيغة دولية بدون + ، fee مثل 0.15</p></div>'}}
async function bs(i,st){const b=B[i];await SB.from("bookings").update({status:st}).eq("id",b.id);
if(st==="confirmed"&&b.client_phone){const p=b.client_phone.replace(/\D/g,"").replace(/^0/,"20");window.open("https://wa.me/"+p+"?text="+encodeURIComponent(`تم تأكيد حجزك مع ${b.expert_name} يوم ${b.day} الساعة ${b.tm}. سنرسل لك رابط الجلسة قبل الموعد.`),"_blank")}tab("b")}
function edit(i){const e=X[i];$("ft").textContent="تعديل: "+e.name;$("id").value=e.id;$("n").value=e.name;$("f").value=e.field||"";$("pr").value=e.price;$("bi").value=e.bio||"";$("cv").value=e.cv||"";$("dy").value=(e.days||[]).join(",");$("ti").value=(e.times||[]).join(",");$("ac").checked=e.active;scrollTo(0,0)}
async function saveX(){const r={name:$("n").value.trim(),field:$("f").value.trim(),price:+$("pr").value||0,bio:$("bi").value,cv:$("cv").value,days:$("dy").value.split(",").map(x=>x.trim()).filter(Boolean).map(Number),times:$("ti").value.split(",").map(x=>x.trim()).filter(Boolean),active:$("ac").checked};if(!r.name)return;const pf=await upl($("ph"),160);if(pf)r.photo=pf;
const id=$("id").value;const q=id?SB.from("experts").update(r).eq("id",id):SB.from("experts").insert(r);const{error}=await q;if(error)alert(error.message);tab("x")}
async function delX(id){if(confirm("حذف الخبير نهائيًا؟")){await SB.from("experts").delete().eq("id",id);tab("x")}}
async function ok(i){const a=A[i];await SB.from("experts").insert({name:a.name,field:a.field,price:+a.price||0,bio:a.bio,cv:a.cv,active:false});await SB.from("applications").delete().eq("id",a.id);tab("x")}
async function rej(id){if(confirm("رفض الطلب؟")){await SB.from("applications").delete().eq("id",id);tab("a")}}
async function dq(id){await SB.from("inquiries").delete().eq("id",id);tab("q")}
async function saveP(){const ks=["pay_pi","pay_pw","pay_pb","pay_pv","fee","whatsapp","phone","email","about","terms"];const{error}=await SB.from("settings").upsert(ks.map(k=>({k,v:$("p_"+k).value.trim()})));alert(error?error.message:"تم الحفظ")}
async function saveId(){const lg=await upl($("cl"),220,true),rows=[{k:"platform",v:$("cn").value.trim()},{k:"tagline",v:$("ct").value.trim()},{k:"color",v:$("cc").value}];if(lg)rows.push({k:"logo",v:lg});const{error}=await SB.from("settings").upsert(rows);alert(error?error.message:"تم الحفظ");tab("c")}
async function rmLogo(){await SB.from("settings").upsert([{k:"logo",v:""}]);tab("c")}
async function addK(){const t=$("nt").value.trim();if(!t)return;const im=await upl($("ni"),700);await SB.from("blocks").insert({title:t,body:$("nb").value,image:im,pos:Date.now()});tab("c")}
async function svK(i){const r={title:$("kt"+i).value,body:$("kb"+i).value},im=await upl($("ki"+i),700);if(im)r.image=im;await SB.from("blocks").update(r).eq("id",K[i].id);tab("c")}
async function mvK(i,d){const j=i+d;if(j<0||j>=K.length)return;await SB.from("blocks").update({pos:K[j].pos}).eq("id",K[i].id);await SB.from("blocks").update({pos:K[i].pos}).eq("id",K[j].id);tab("c")}
async function tgK(i){await SB.from("blocks").update({active:!K[i].active}).eq("id",K[i].id);tab("c")}
async function dlK(i){if(confirm("حذف الفقرة؟")){await SB.from("blocks").delete().eq("id",K[i].id);tab("c")}}
async function saveS(){const rows=KEYS.map(k=>({k,v:$("s_"+k).value.trim()}));const{error}=await SB.from("settings").upsert(rows);alert(error?error.message:"تم الحفظ")}
SB.auth.getSession().then(({data:{session}})=>{if(session)start()});
</script></body></html>
